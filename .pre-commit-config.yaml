repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
  - repo: local
    hooks:
      - id: pnpm-lint
        name: pnpm lint
        entry: pnpm run lint
        language: system
        pass_filenames: false
      - id: pnpm-typecheck
        name: pnpm typecheck
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
